name: FlipSide tests (development only)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT (KOReader Lua runtime family)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends luajit
      - name: Validate sources and temporary SQLite schema
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run Lua regression tests with isolated mocked settings
        run: luajit tests/run.lua
      - name: Build installation ZIP without tests
        run: python3 scripts/build_release.py
      - name: Verify distribution excludes tests and GitHub workflow
        run: python3 -m unittest discover -s tests -p 'test_release.py' -v
      - name: Attach installation-only ZIP to this run
        uses: actions/upload-artifact@v4
        with:
          name: flipside-installation-only
          path: dist/FlipSide-1.0.0-rc.1.zip
          if-no-files-found: error
